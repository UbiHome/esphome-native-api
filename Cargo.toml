[package]
name = "esphome-native-api"
version = "0.0.0"
edition = "2024"
license = "MIT"
keywords = ["esphome", "homeassistant"]
categories = ["api-bindings"]
homepage = "https://github.com/UbiHome/esphome-native-api"
repository = "https://github.com/UbiHome/esphome-native-api"
documentation = "https://docs.rs/esphome-native-api"
readme = "README.md"
description = "Rust implementation of the ESPHome native API for communication with ESPHome devices, supporting both encrypted and plaintext connections."
include = [
    "/LICENSE",
    "/README.md",
    "/Cargo.toml",
    "/Cargo.lock",
    "/src/*",
    "!/src/proto/.gitignore"
]

[dependencies]
prost = { version = "0.13.5", default-features = false, features = ["derive"] }

# Protocol core (`protocol` feature): runtime-free and `no_std` + `alloc` compatible.
log = { version = "0.4", optional = true }
thiserror = { version = "2", default-features = false, optional = true }
base64 = { version = "0.22.1", default-features = false, features = ["alloc"], optional = true }
noise-protocol = { version = "0.2.0", default-features = false, features = ["use_alloc"], optional = true }
noise-rust-crypto = { version = "0.6.2", default-features = false, features = ["use-x25519", "use-chacha20poly1305", "use-sha2"], optional = true }

# Tokio front end (`std` feature).
tokio = { version = "1", features = ["full"], optional = true }
typed-builder = { version = "0.21.0", optional = true }

[workspace]
resolver = "2"
members = ["generator"]

[dev-dependencies]
pretty_env_logger = "0.5.0"
test-log = { version = "0.2.16", features = ["log", "color"] }

[[example]]
name = "easy_server"
required-features = ["std"]

[[example]]
name = "encrypted_server"
required-features = ["std"]

[[example]]
name = "test_server"
required-features = ["std"]

[[test]]
name = "esphomeapi_test"
required-features = ["std"]

[[test]]
name = "protocol_test"
required-features = ["protocol"]

# The features table must stay last: the generator rewrites everything from its header on.
[features]
default = ["std", "version_2026_10_2"] # To change the default version, update `CURRENT_VERSION` in `generator/src/main.rs`.
# Tokio based API (`EspHomeApi`, `EspHomeServer`, `Connection`).
std = ["protocol", "dep:tokio", "dep:typed-builder", "prost/std", "thiserror/std", "base64/std", "log/std", "noise-protocol/use_std"]
# Runtime-free protocol core (`protocol::Protocol`). Works on `no_std` targets with `alloc`.
protocol = ["dep:log", "dep:thiserror", "dep:base64", "dep:noise-protocol", "dep:noise-rust-crypto"]
